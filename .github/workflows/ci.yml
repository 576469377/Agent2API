name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    name: console / diagnostic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 前端语法与离线行为
        run: |
          node --check internal/web/static/app.js
          node --check internal/web/static/monitor.js
          node --test scripts/test-console-*.mjs
      - name: 请求诊断隐私、单次转发与流式测试
        run: python3 -m unittest discover -s scripts -p test_diagnose_proxy.py

  secret-check:
    name: credential guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 扫描全部可达历史（不输出密钥值）
        run: python3 scripts/check-secrets.py --history
      - name: 提交保护回归测试
        run: python3 -m unittest discover -s scripts -p test_check_secrets.py

  build-test:
    name: build / vet / test (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # go.mod 声明 go 1.23.0 —— 测声明下限才能真正保证兼容
        go: ['1.23.x', 'stable']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: 校验依赖
        run: go mod verify

      - name: 构建
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: 测试（含竞态检测）
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.txt | tail -1

  # 单独跑一次不含 -race 的覆盖率，方便本地对比
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: 覆盖率明细
        run: go test ./... -cover

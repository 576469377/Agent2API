<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Agent2API — Your models. One endpoint.</title>
  <desc id="desc">Seven platform integrations connect to one local gateway, exposing Chat Completions, Responses and Anthropic Messages. Routing, streaming and observability share one workspace.</desc>

    <linearGradient id="hub" x2="1" y2="1"><stop stop-color="#293c5d"/><stop offset="1" stop-color="#1b273c"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#649eff" stop-opacity=".19"/><stop offset="1" stop-color="#649eff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#adc5ee" stroke-opacity=".045"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="438" rx="22"/></clipPath>

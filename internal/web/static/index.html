<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent2API · 控制台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%23222225%22%2F%3E%3Cg%20stroke%3D%22%23e7a077%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M9%207h5l6%209h5M9%2025h5l6-9M9%2016h11%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23e7a077%22%3E%3Ccircle%20cx%3D%227%22%20cy%3D%227%22%20r%3D%222.5%22%2F%3E%3Ccircle%20cx%3D%227%22%20cy%3D%2216%22%20r%3D%222.5%22%2F%3E%3Ccircle%20cx%3D%227%22%20cy%3D%2225%22%20r%3D%222.5%22%2F%3E%3Ccircle%20cx%3D%2226%22%20cy%3D%2216%22%20r%3D%222.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("agent2api_theme") || "auto";
      } catch {}
    </script>
    <link rel="stylesheet" href="/static/style.css?v=operations-1" />
    <link rel="stylesheet" href="/static/dashboard.css?v=studio-1" />
    <link rel="stylesheet" href="/static/workbench.css?v=console-data-1" />
    <link rel="stylesheet" href="/static/usage.css?v=history-allocation-1" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <a class="brand" href="#overview"
          ><span class="brand-icon"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M9 7h5l6 9h5M9 25h5l6-9M9 16h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="7" r="2.5" fill="currentColor"/><circle cx="7" cy="16" r="2.5" fill="currentColor"/><circle cx="7" cy="25" r="2.5" fill="currentColor"/><circle cx="26" cy="16" r="2.5" fill="currentColor"/></svg></span
          ><span
            ><strong>Agent2API</strong
            ><small id="brandSubtitle">统一模型网关</small></span
          ></a
        >
        <div class="nav-caption" id="navCaption">工作空间</div>
        <nav id="nav"></nav>
        <div class="sidebar-bottom">
          <a class="sidebar-shortcut" href="#chat" id="sidebarShortcut"></a>
          <div class="sidebar-status">
            <span class="status-dot" id="healthDot"></span
            ><span id="healthText">连接中</span
            ><span class="version" id="version"></span>
          </div>
          <div class="preferences">
            <select id="langSel" aria-label="语言 / Language">
              <option value="zh">中文</option>
              <option value="en">English</option></select
            ><select id="themeSel" aria-label="主题 / Theme">
              <option value="auto">跟随系统</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <button
            class="icon-button mobile-menu"
            id="menuButton"
            aria-label="展开导航"
          ></button>
          <div class="topbar-leading"><button class="icon-button sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-label="收起侧栏" aria-expanded="true"></button><div class="breadcrumbs">
            <span>Agent2API</span><span class="breadcrumb-divider">/</span
            ><strong id="breadcrumb">概览</strong>
          </div></div>
          <div class="topbar-actions">
            <button class="quick-search" id="quickSearch" data-action="command-search" aria-label="搜索与快捷跳转"></button>
            <span class="connection-badge" id="connectionBadge"
              >正在连接网关</span
            ><button class="button small" id="copyEndpoint"></button>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <header class="page-header">
            <div>
              <div class="eyebrow" id="pageEyebrow">WORKSPACE OVERVIEW</div>
              <h1 id="pageTitle">网关概览</h1>
              <p id="pageDescription"></p>
            </div>
            <div class="page-actions">
              <div id="pagePrimary"></div>
              <span class="updated-at" id="updatedAt"></span
              ><select id="autoRefresh" class="select" aria-label="自动刷新间隔"></select><button class="button" id="refreshButton"></button>
            </div>
          </header>
          <div
            class="notice error-notice"
            id="errorBanner"
            role="alert"
            hidden
          ></div>
          <div id="pricingBanner" class="notice rate-banner" role="status" hidden></div>
          <div id="pageContent">
            <div class="loading-state">
              <span class="spinner"></span>正在连接网关…
            </div>
          </div>
        </main>
        <footer class="workspace-footer">
          <span id="footerText">一个入口，连接全部平台。</span
          ><span id="footerEndpoint"></span>
        </footer>
      </div>
    </div>
    <dialog id="detailDialog" class="drawer">
      <div id="detailContent"></div>
    </dialog>
    <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/static/app.js?v=history-allocation-1"></script>
  </body>
</html>
